# =============================================================
# CARLA Lane Keeping RL — Configuration
# =============================================================
# All tunable parameters live here.
# Change a value here and it propagates everywhere automatically.
# This file is the single source of truth for your thesis
# hyperparameter table.

# ── Algorithm selection ─────────────────────────────────────────
# Which RL algorithm to train with. Overridden by `--algo` on the CLI.
# One of: ppo, sac, ddpg, td3. (DQN is not supported — this project's
# action space is continuous; see docs/superpowers/specs/2026-06-23-
# multi-algorithm-training-design.md for why and the planned path to
# add it.)
algo: ppo

# ── Environment ───────────────────────────────────────────────
env:
  host:           "localhost"
  port:           2000
  map_name:       "Town04"
  max_steps:      1000          # steps per episode before truncation
  action_smooth:  0.6           # action smoother alpha (0=heavy, 1=none)
  seed:           42            # random seed for spawn point selection
  spawn_index:    150           # int = always spawn here (deterministic,
                                 #   for validating learning); null = random.
                                 #   150 chosen on a straight Town04 segment
                                 #   clear of any junction/fork for 450m ahead
                                 #   (a full episode at target speed covers
                                 #   ~417m). Index 0 hit a fork ~310m ahead,
                                 #   causing collisions with barrels.

# ── Reward function ───────────────────────────────────────────
reward:
  w_center:         1.0         # weight: centering reward
  w_speed:          1.5         # weight: speed reward
  w_heading:        0.5         # weight: heading alignment reward
  w_smooth:         0.5         # weight: action smoothness penalty
                                 #   (set to 0.0 to disable)
  target_speed_kmh: 30.0        # desired cruising speed
  sigma_speed:      10.0        # Gaussian width for speed reward
  terminal_penalty: -10.0       # penalty for collision / off-road
  step_penalty:     -0.1        # small penalty per step

# ── PPO hyperparameters ───────────────────────────────────────
# These are Stable-Baselines3 PPO defaults, tuned for CARLA.
# See: https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html
ppo:
  learning_rate:    0.0003      # Adam optimizer learning rate
  n_steps:         2048         # steps collected per update (rollout buffer)
  batch_size:       64          # minibatch size for gradient updates
  n_epochs:         10          # number of epochs per update
  gamma:            0.99        # discount factor
  gae_lambda:       0.95        # GAE lambda for advantage estimation
  clip_range:       0.2         # PPO clipping parameter
  ent_coef:         0.05        # entropy coefficient (exploration)
                                 #   raised from 0.01 — PPO converged to a
                                 #   "stand still" local optimum (speed~0,
                                 #   reward plateau ~1880/ep) in the
                                 #   2026-06-26 run; SAC's auto entropy
                                 #   tuning escaped the same optimum, PPO's
                                 #   fixed low ent_coef did not
  vf_coef:          0.5         # value function loss coefficient
  max_grad_norm:    0.5         # gradient clipping
  verbose:          1           # SB3 verbosity (0=silent, 1=info, 2=debug)

# ── SAC hyperparameters ────────────────────────────────────────
# Off-policy, stochastic policy — explores via entropy, no action
# noise needed. Starting points from SB3 defaults; not yet
# benchmarked against CARLA, adjust based on experiments.
# See: https://stable-baselines3.readthedocs.io/en/master/modules/sac.html
sac:
  learning_rate:    0.0003       # Adam optimizer learning rate
  buffer_size:      200000       # replay buffer capacity (transitions)
  learning_starts:  1000         # steps of random actions before training starts
  batch_size:       256          # minibatch size for gradient updates
  tau:              0.005        # target network soft-update rate
  gamma:            0.99         # discount factor
  train_freq:       1            # train every N environment steps
  gradient_steps:   1            # gradient updates per training call
  verbose:          1            # SB3 verbosity (0=silent, 1=info, 2=debug)

# ── DDPG hyperparameters ───────────────────────────────────────
# Off-policy, deterministic policy — needs explicit action noise for
# exploration (unlike SAC). Starting points from SB3 defaults; not yet
# benchmarked against CARLA, adjust based on experiments.
# See: https://stable-baselines3.readthedocs.io/en/master/modules/ddpg.html
ddpg:
  learning_rate:      0.001      # Adam optimizer learning rate
  buffer_size:        200000     # replay buffer capacity (transitions)
  learning_starts:    1000       # steps of random actions before training starts
  batch_size:         256        # minibatch size for gradient updates
  tau:                0.005      # target network soft-update rate
  gamma:              0.99       # discount factor
  train_freq:         1          # train every N environment steps
  gradient_steps:     1          # gradient updates per training call
  action_noise_sigma: 0.1        # stddev of Gaussian exploration noise
  verbose:            1          # SB3 verbosity (0=silent, 1=info, 2=debug)

# ── TD3 hyperparameters ────────────────────────────────────────
# Off-policy, deterministic policy (DDPG's successor) — also needs
# explicit action noise. Starting points from SB3 defaults; not yet
# benchmarked against CARLA, adjust based on experiments.
# See: https://stable-baselines3.readthedocs.io/en/master/modules/td3.html
td3:
  learning_rate:      0.001      # Adam optimizer learning rate
  buffer_size:        200000     # replay buffer capacity (transitions)
  learning_starts:    1000       # steps of random actions before training starts
  batch_size:         256        # minibatch size for gradient updates
  tau:                0.005      # target network soft-update rate
  gamma:              0.99       # discount factor
  train_freq:         1          # train every N environment steps
  gradient_steps:     1          # gradient updates per training call
  action_noise_sigma: 0.1        # stddev of Gaussian exploration noise
  verbose:            1          # SB3 verbosity (0=silent, 1=info, 2=debug)

# ── Training ──────────────────────────────────────────────────
training:
  total_timesteps:  500000      # total environment steps to train for
                                # 500k is a reasonable first run (~8 hours)
                                # increase to 1M-2M for better performance
  eval_freq:        10000       # evaluate every N training steps
  eval_episodes:    5           # episodes per evaluation
  save_freq:        10000       # save checkpoint every N steps
  log_interval:     10          # SB3 log every N updates

# ── Paths ─────────────────────────────────────────────────────
# These are base directories. agent/train.py joins each with the
# current algorithm name, e.g. results/checkpoints/sac/, so runs for
# different algorithms never collide or overwrite each other.
# best_model is not listed separately — it's {checkpoint_dir}/{algo}/best_model.
paths:
  log_dir:          "results/logs"
  checkpoint_dir:   "results/checkpoints"
  plot_dir:         "results/plots"
